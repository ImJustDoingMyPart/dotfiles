# Lanzador de aplicaciones — el provider por defecto de walker.
#
# ⚠ ESTE ARCHIVO PERDIÓ SUS COMENTARIOS ORIGINALES el 2026-08-05: un
# `elephant generate config` lo reescribió. Los VALORES de abajo son los que Roberto
# había puesto (el comando los conserva), pero la explicación de por qué cada uno era
# así se perdió y no hay copia. Si algo de acá tiene un motivo, vale la pena volver a
# anotarlo.
#
# Valor claramente propio y no default: single_instance_apps = [discord].
#
# NO CORRER `elephant generate config`: reescribe TODOS los archivos de esta carpeta,
# los normaliza a la forma canónica y BORRA LOS COMENTARIOS. Conserva los valores, no la
# prosa. Pasó el 2026-08-05 y se llevó puestos los comentarios de este archivo.
#
# Y OJO con lo que genera: pone `icon` dentro de una sección [Config] que el propio
# elephant 2.22.0 IGNORA al cargar. La forma que SÍ funciona es la clave suelta arriba de
# todo, como está acá. Verificado las dos veces contra el providerlist real, no leyendo
# la doc: con [Config] los íconos volvían a los defaults.

action_min_score = 20
blacklist = []
history = true
history_when_empty = false
icon_placeholder = 'applications-other'
ignore_pin_with_window = true
locale = ''
only_search_title = true
score_open_windows = true
show_actions = true
show_actions_without_query = false
show_generic = true
single_instance_apps = ['discord']
window_integration = true
window_integration_ignore_actions = false
wm_integration = false

[aliases]
