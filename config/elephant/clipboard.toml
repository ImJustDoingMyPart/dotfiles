# Historial del portapapeles (prefijo `:` en walker).
#
# El default era `user-bookmarks`, que ADEMÁS ya usaba el provider Bookmarks: dos
# entradas distintas del providerlist con la misma estrella amarilla. `clipboard` es el
# clip a color de apps/. Ver el criterio completo en bluetooth.toml.
#
# NO CORRER `elephant generate config`: reescribe TODOS los archivos de esta carpeta,
# los normaliza a la forma canónica y BORRA LOS COMENTARIOS. Conserva los valores, no la
# prosa. Pasó el 2026-08-05 y se llevó puestos los comentarios de desktopapplications.toml.
#
# Y OJO con lo que genera: pone `icon` dentro de una sección [Config] que el propio
# elephant 2.22.0 IGNORA al cargar. La forma que SÍ funciona es la clave suelta arriba de
# todo, como está acá. Verificado las dos veces contra el providerlist real, no leyendo
# la doc: con [Config] los íconos volvían a los defaults.

icon = 'clipboard'

auto_cleanup = 0
command = 'wl-copy'
ignore_symbols = true
image_editor_cmd = ''
max_items = 100
ocr = false
pinned_on_top = false
text_editor_cmd = ''
