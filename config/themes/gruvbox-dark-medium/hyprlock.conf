# Gruvbox Dark Medium — SOLO los colores del lock.
#
# La estructura está en ~/.config/hypr/hyprlock.conf, que trae este archivo con `source`.
# (El archivo `swaylock` al que reemplaza tenía que ser la config entera porque swaylock no
# soporta include; hyprlock sí.)
#
# Los valores son los mismos del port de nickjj/dotfriedrice que usan waybar.css y
# walker.css de este tema, para que el lock no se despegue del resto.

$theme_surface = rgb(282828)
$theme_card    = rgba(50, 48, 47, 0.85)

$theme_fg     = rgb(d4be98)
$theme_fg_dim = rgb(bdae93)

# Mismo par accent / accent_alt que walker.css de este tema.
$theme_accent     = rgb(83a598)
$theme_accent_alt = rgb(d3869b)

$theme_error   = rgb(ea6962)
$theme_warning = rgb(d8a657)
