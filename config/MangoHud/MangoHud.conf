# MangoHud — perfil de diagnóstico para los bajones de FPS (ver nota Gaming).
# Solo se aplica a lo que se lance con `mangohud <cmd>`; no afecta nada más.
# Opciones tomadas de /usr/share/doc/mangohud/MangoHud.conf.example (0.8.4).

fps
fps_metrics=avg,0.01
frametime
frame_timing

# Lo que distingue "la GPU se quedó sin clocks" de "algo cappea la presentación":
gpu_stats
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_temp
gpu_load_change
gpu_load_value=60,90
vram
throttling_status

cpu_stats
cpu_temp
cpu_load_change
ram

# Contexto de presentación: modo de present de Vulkan y refresco que ve el juego.
present_mode
refresh_rate
resolution
vulkan_driver

position=top-left
font_size=20
toggle_hud=Shift_R+F12
