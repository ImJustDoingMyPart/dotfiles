# hyprlock 0.9.6 — pantalla de bloqueo.
#
# Reemplaza a swaylock (migración 2026-08-13). Lo que se gana: reloj, fecha, fondo
# desenfocado por GPU y texto arbitrario — justo lo que el punto F3 del plan de pulido daba
# por imposible ("swaylock no puede: no dibuja reloj, fecha ni texto arbitrario. Es el techo
# del programa. Si algún día se quiere media y clima en el login box, hay que cambiar de
# locker").
#
# ─── Estructura vs. color ───
#
# A diferencia de swaylock, hyprlock SÍ soporta `source`, así que se pudo hacer lo mismo que
# waybar, walker y swaync: este archivo tiene la estructura (tamaños, posiciones, textos) y el
# color entra por un archivo aparte que maneja `theme-set`. Ya no hace falta duplicar la
# config entera en cada tema.
#
#     ~/.config/themes/<tema>/hyprlock.conf  <-  ~/.config/hypr/hyprlock-colors.conf
#
# `source` está registrado como handler en el binario 0.9.6 (ConfigManager.cpp:
# `m_config.registerHandler(&::handleSource, "source", ...)`) y resuelve el path con
# glob(GLOB_TILDE), así que el `~` se expande.
#
# El source va PRIMERO: hyprlang sustituye las variables en orden de aparición, y una
# variable usada antes de definirse queda como texto literal.
source = ~/.config/hypr/hyprlock-colors.conf

# La misma tipografía que waybar, walker, swaync y la terminal.
$font = JetBrainsMono Nerd Font

general {
    # Equivalente a `ignore-empty-password` de swaylock: no intentar autenticar con el
    # buffer vacío. Evita un intento fallido por cada Enter accidental (que además pintaba
    # el aro de "wrong").
    ignore_empty_input = true

    # Dibujar el fondo apenas se puede en vez de esperar a que todos los recursos estén
    # listos. Importa en el caso before_sleep: mientras menos tarde hyprlock en tapar la
    # pantalla, más chica es la ventana de carrera con la suspensión (ver hypridle.conf).
    immediate_render = true

    hide_cursor = true
}

# ─── Animaciones ───
#
# hyprlock anima por un ÁRBOL de nodos que hereda: `global` -> {`fade` -> {fadeIn, fadeOut},
# `inputField` -> {inputFieldColors, inputFieldFade, inputFieldWidth, inputFieldDots}}.
# Fijar un nodo padre alcanza a los hijos que no se declaren aparte. Los defaults del
# programa son `global` a velocidad 8 con la curva `default`, y `inputFieldColors` a 8 con
# `linear` (ConfigManager.cpp).
#
# UNIDAD DE `speed`: DECISEGUNDOS, no milisegundos ni segundos. Sale de la cuenta de
# hyprutils 0.14.1 (AnimatedVariable.cpp): `(msTranscurridos / 100) / speed`. O sea que
# speed = 2 es una animación de 200 ms, y el default 8 son 800 ms.
#
# OJO, DOS TRAMPAS del parser (ConfigManager.cpp: handleAnimation):
#
#   1. La velocidad se guarda en un `int64_t`. Un 2.5 se trunca a 2 sin avisar, y cualquier
#      valor menor que 1 termina en 0, que el propio parser rechaza con "invalid speed". El
#      mínimo real es 1 = 100 ms.
#   2. Un `bezier` tiene que estar definido ANTES de la línea `animation` que lo nombra:
#      hyprlang ejecuta los handlers a medida que lee. Si no existe todavía, devuelve
#      "no such bezier" y el nodo cae en la curva `default` — sin romper nada y sin que se
#      note más que en el journal.
#
# Las únicas curvas que vienen de fábrica son `default` (bezier (0,0.75)(0.15,1), de
# hyprutils) y `linear`, que registra el propio hyprlock en su AnimationManager.
#
# Las curvas: ease-out-quad a 200 ms para entrar y ease-out-cubic a 200 ms para salir, rápidas
# y sin rebote, como tiene que sentirse algo que se usa varias veces por día. Van como beziers
# cúbicos porque es lo único que hyprlock entiende: el 5º argumento de `animation`, el estilo,
# lo ignora, así que no hay resortes.
animations {
    enabled = true

    bezier = easeOutQuad, 0.5, 1, 0.89, 1
    bezier = easeOutCubic, 0.33, 1, 0.68, 1

    # Aparición del lock. Los 200 ms además acortan lo que se transparenta al despertar: hypridle
    # (inhibit_sleep = 3) deja dormir apenas la superficie del lock está arriba, que puede ser
    # antes de que termine el fundido (wiki de hypridle, hypridle#146). Bajar de los 800 ms del
    # default es también una mejora de privacidad. Misma preocupación que `immediate_render`.
    animation = fadeIn, 1, 2, easeOutQuad

    # Desaparición al desbloquear, con la curva de `window-close`.
    animation = fadeOut, 1, 2, easeOutCubic

    # Los puntitos que aparecen al tipear. Es realimentación por tecla: tiene que sentirse
    # instantánea, así que va al mínimo que el parser acepta (100 ms) y lineal, porque lo que
    # anima es un CONTEO de puntos y no un desplazamiento.
    animation = inputFieldDots, 1, 1, linear

    # Viraje del degradé del borde a `check_color` / `fail_color`. Se queda en lineal como el
    # default —un cruce de color se lee mejor parejo— pero a 300 ms en vez de 800: avisar de
    # una contraseña equivocada es de las pocas cosas que no conviene que tarden.
    animation = inputFieldColors, 1, 3, linear

    # El campo se ensancha para que entre el texto, y desde que `fail_text` dice
    # "Autenticación fallida (N)" —más largo que el placeholder— esto se ve en cada error.
    animation = inputFieldWidth, 1, 2, easeOutQuad

    # `inputFieldFade` se deja SIN declarar a propósito: anima el desvanecido del campo
    # cuando no se tipea, y acá está apagado de raíz por `fade_on_empty = false`.
}

# ─── Fondo ───
#
# `path = screenshot` (lo que hace omarchy) NO se usa acá a propósito: congela lo que había
# en pantalla al bloquear, así que el lock muestra las ventanas abiertas desenfocadas. Se
# usa el WALLPAPER, que es lo que ya hacía el `lock` de swaylock y lo que mantiene la
# uniformidad: el escritorio, el backdrop del overview y el lock son la misma imagen con
# distinto tratamiento.
#
# La ruta es FIJA y absoluta porque la config es estática y el wallpaper cambia:
# `wallpaper-set` deja siempre una copia normalizada (tamaño de pantalla) en esa ruta. Es el
# mismo mecanismo que usaba swaylock, con una diferencia — hyprlock sí linkea libjpeg y
# libwebp (verificado con ldd), así que la copia ya no existe por formato sino por velocidad
# y por tener una ruta que no se mueve.
background {
    monitor =
    path = /home/anon/.local/state/wallpaper-lock.png

    # Desenfoque por GPU sobre el mismo wallpaper del escritorio: el lock se lee como una capa
    # más del sistema y no como una pantalla ajena.
    blur_passes = 2
    blur_size = 6

    # `brightness` es un parámetro del shader de blur, así que solo tiene efecto con
    # blur_passes > 0. Oscurece el fondo para que el reloj y la fecha —que flotan sobre la
    # imagen, no sobre una superficie del tema— se lean sobre CUALQUIER wallpaper.
    # Ojo si algún día matugen se corre en modo claro: ahí on_surface es oscuro y este valor
    # habría que subirlo (el default del programa es 0.8172).
    brightness = 0.75

    # ─── Textura del desenfoque ───
    #
    # Los tres van al mismo shader que `brightness`, así que también dependen de
    # blur_passes > 0. Los valores no son inventados: salen de leer Shaders.hpp de la 0.9.6,
    # que es donde se ve en qué pasada entra cada uno y con qué cuenta.
    #
    # `contrast` corre en FRAGBLURPREPARE, o sea ANTES de desenfocar, y aplica una curva S
    # simétrica alrededor del gris medio: `gain(x, k)`, donde k = 1 es la identidad (el
    # shader ni la evalúa), k < 1 aplana y k > 1 empina. El default 0.8917 APLANA.
    #
    # Es la ÚNICA de las tres perillas de textura que mueve el color, y por un camino que no
    # es obvio: `gain` se aplica por canal R, G y B por separado, así que empinar la curva
    # separa los canales entre sí y eso satura. Medido sobre el wallpaper de prueba, pasando
    # de 0.8917 a 1.1: saturación media 38,4 -> 44,5 (+16 %) y desvío de luminancia
    # 18,6 -> 19,7 (+6 %), a cambio de 2 puntos de luminancia media. O sea que repone de
    # una sola vez el volumen y el color que se pierden al desenfocar y oscurecer a 0.75.
    #
    # 1.1 es deliberadamente conservador: el fondo tiene que sostener al reloj, no competirle.
    contrast = 1.1

    # `vibrancy` y `vibrancy_darkness` SE DEJAN EN SUS DEFAULTS (0.1686 y 0.05), y no por
    # olvido — se probaron y no hacen nada acá. `vibrancy` es lo que parece el control de
    # saturación, pero barriendo TODO su rango con el resto fijo, la saturación media del
    # cuadro va de 43,5 (en 0.0) a 45,1 (en 0.9): 1,6 puntos entre apagado y al mango, contra
    # los 5,7 que mueve `contrast` solo. Tiene explicación en el shader: el boost se divide
    # por la cantidad de pasadas (`boostBase * vibrancy / passes`, y acá son 2) y además pasa
    # por un smoothstep que solo levanta pixeles en cierta banda de saturación y brillo, con
    # lo cual sobre un wallpaper ya saturado casi no queda margen. Si algún día el fondo es
    # una imagen apagada, puede volver a tener sentido; sobre estos, no.

    # `noise` corre en FRAGBLURFINISH: suma ruido de hash por pixel, `rgb += (hash - 0.5) *
    # noise`. Es lo que le saca el bandeado a los degradés grandes, que un blur de 2 pasadas
    # sobre un wallpaper de 1920x1080 deja a la vista. El default 0.0117 es ±1,5/255, casi
    # nada. Con 0.03 son ±3,8/255 — y ojo que en ese mismo shader el ruido se suma ANTES de
    # multiplicar por `brightness`, así que lo que se ve en pantalla es ese valor por 0.75.
    noise = 0.03

    # Fallback si la copia del wallpaper no existe (primer arranque, o alguien puso el fondo
    # sin pasar por `wallpaper-set`). Es el equivalente del `color=` de swaylock.
    color = $theme_surface
}

# ─── Reloj ───
#
# Hora y minutos en dos colores distintos de la paleta. Eso obliga a salir de `$TIME`: la
# sustitución interna del programa devuelve "HH:MM" como un solo string y no hay forma de
# pintar la mitad. Las dos salidas eran partirlo en dos labels (posicionados a mano, frágil
# ante cualquier cambio de font_size) o markup de pango en un label solo — que es esto.
#
# hyprlock pasa el texto por pango, que es el mismo motor que ya hace andar el `<i>` del
# placeholder de abajo. Los colores llegan en forma `#rrggbb` desde el archivo de tema
# (hyprlock-colors.conf); ojo con el `##` allá, está explicado ahí.
#
# El costo de dejar `$TIME`: un `date` por segundo mientras la pantalla está bloqueada. Se
# eligió 1000 ms y no 60000 porque el timer de `cmd[update:]` no está alineado al cambio de
# minuto — con 60 s el reloj podía mostrar un minuto viejo hasta un minuto entero, que en un
# reloj se ve. Un fork de `date` es del orden del milisegundo; la fecha de más abajo sí puede
# quedarse en 60 s porque un día dura bastante más que eso.
#
# > SE PROBÓ UN RELOJ DE ARTE DE BLOQUES Y SE DESCARTÓ (2026-08-15). Dos variantes, las dos
# > vistas en pantalla y las dos rechazadas por gusto: dígitos figlet "ANSI Shadow" (el bisel
# > ╔╗╚╝ del logo de LazyVim) y "ANSI Regular" (bloque macizo, el idioma del de Omarchy). El
# > generador quedó en ~/.local/bin/hyprlock-clock por si alguna vez se retoma; hoy no lo
# > llama nadie. Lo que se aprendió está en la nota del vault (Apariencia, sección 10).
label {
    monitor =
    text = cmd[update:1000] date +"<span foreground='$theme_hour'>%H</span><span foreground='$theme_colon'>:</span><span foreground='$theme_min'>%M</span>"
    font_family = $font
    font_size = 96
    color = $theme_fg

    position = 0, 170
    halign = center
    valign = center

    # POR QUÉ SOMBRA Y NO UN RECUADRO: con swaylock el texto vivía DENTRO del anillo, sobre
    # `surface_container`, y Material 3 garantiza el contraste de ese par (se midió: peor
    # caso 12,6:1 sobre 40 paletas). Acá el texto flota sobre el wallpaper, así que esa
    # garantía no aplica y hay que reponerla: la sombra da contraste contra cualquier imagen
    # sin depender del esquema.
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ─── Fecha ───
#
# `cmd[update:N]` corre el comando cada N milisegundos. Se usa `date` y no una sustitución
# interna porque hyprlock no tiene variable de fecha.
#
# Sale en castellano porque el entorno del servicio de usuario tiene LANG=es_AR.UTF-8
# (`systemctl --user show-environment`), y hyprlock hereda ese entorno. Es la diferencia con
# el módulo `clock` de waybar, que ignora la locale y por eso allá la fecha está en inglés.
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d de %B"
    font_family = $font
    font_size = 20
    color = $theme_fg_dim

    position = 0, 70
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ─── Campo de contraseña ───
#
# Las medidas son las del sistema: `rounding = 4` es el mismo radio que las ventanas
# (decoration.rounding), rofi y swaync; el borde de 2 px con degradé primary -> tertiary a 45°
# es literalmente el mismo par que el borde de la ventana activa y el de rofi.
input-field {
    monitor =
    size = 340, 48
    rounding = 4
    outline_thickness = 2

    inner_color = $theme_card
    outer_color = $theme_accent $theme_accent_alt 45deg
    font_color = $theme_fg

    # OJO, acá NO va $font: es la variante "Mono" a propósito. La familia sin sufijo dibuja
    # los iconos Nerd Font a DOBLE ancho, y hyprlock reserva una celda por carácter tipeado,
    # así que el glifo de abajo salía cortado por la mitad (se vio en captura: el aro se leía
    # como una "C"). La variante Mono trae los iconos a un ancho de celda y entran enteros.
    # Las letras latinas son las mismas, así que el placeholder y los mensajes no cambian.
    font_family = JetBrainsMono Nerd Font Mono

    # Verificando / falló. `check_color` invierte el degradé para que el cambio se note sin
    # cambiar de familia de color; `fail_color` es el rol error, igual que el urgent de la
    # barra.
    check_color = $theme_accent_alt $theme_accent 45deg
    fail_color = $theme_error

    # Bloq Mayús. Si se deja vacío, hyprlock cae a `outer_color` y el aviso no existe.
    # NO se define `numlock_color` a propósito: acá el numlock arranca ENCENDIDO
    # (cfg/input.kdl), así que un realce por numlock estaría prendido siempre.
    capslock_color = $theme_warning

    placeholder_text = <i>Contraseña</i>
    check_text = <i>Verificando…</i>

    # Equivalente de `show-failed-attempts` de swaylock. $ATTEMPTS es sustitución de
    # hyprlock: la cantidad de intentos fallidos.
    #
    # El motivo del texto LITERAL en vez de $FAIL: hyprlock no tiene traducciones. Ante
    # contraseña incorrecta, $FAIL es siempre la constante inglesa "Authentication failed",
    # hardcodeada en su Pam.cpp (`ret == PAM_AUTH_ERR ? "Authentication failed" : ...`), y
    # no hay opción de config para cambiarla.
    #
    # Lo único que PAM puede llegar a meter en $FAIL es el aviso de pam_faillock con los
    # minutos que faltan para el desbloqueo — y en esta máquina tampoco llega: hyprlock lo
    # detecta buscando el substring INGLÉS "left to unlock" en el mensaje, pero el servicio
    # corre con LANG=es_AR.UTF-8 y libpam lo emite traducido ("N minutos restantes para el
    # desbloqueo"), así que el match falla. O sea que acá $FAIL no tiene más contenido que
    # esa constante, y escribirla en castellano no pierde nada.
    fail_text = <i>Autenticación fallida ($ATTEMPTS)</i>

    # Mantener el campo SIEMPRE visible, como el `indicator-idle-visible` de swaylock. Con
    # el default el campo se desvanece cuando no se tipea y la pantalla queda vacía, que fue
    # justo la primera impresión de "parece colgada" que se corrigió en swaylock.
    fade_on_empty = false

    # ─── Glifos de ocultamiento ───
    #
    # `dots_text_format` reemplaza el círculo relleno que dibuja hyprlock por texto, uno por
    # carácter tipeado. Se usa U+F192 (nf-fa-dot_circle_o), el aro con punto: acompaña la
    # idea del resto del lock —contorno fino, nada macizo, geometría redonda como el
    # `rounding` del campo— sin caer en el candado literal. Se verificó en captura a tamaño
    # real, y que el glifo existe en la JetBrainsMono Nerd Font instalada (tabla cmap).
    #
    # Alternativas que también están en la fuente, si alguna vez se quiere otra cosa:
    #   = U+F10C  aro hueco (nf-fa-circle_o), más liviano
    #   = U+F023  candado (nf-fa-lock), literal
    #   = U+F084  llave (nf-fa-key)
    #    ● = U+25CF  círculo lleno tipográfico — el default de hyprlock, en versión Unicode
    dots_text_format = 
    dots_size = 0.30
    dots_spacing = 0.35

    position = 0, -50
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}
