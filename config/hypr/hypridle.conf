# hypridle 0.1.8 — apagar pantallas y bloquear por inactividad.
#
# Reemplaza a swayidle (migración 2026-08-13). Los tiempos son los mismos que tenía
# swayidle.service y son de desktop, no de notebook: acá no hay batería que cuidar, así que
# la pantalla se apaga tarde y el bloqueo llega después.
#
#   10 min -> apagar pantallas (DPMS). Cualquier input las vuelve a encender.
#   20 min -> bloquear.
#   antes de suspender -> bloquear siempre.
#
# NO hay listener de `systemctl suspend`: esta máquina no se suspende sola (ver la nota de
# suspensión en el vault). Si alguna vez se quiere, se agrega un listener con un timeout más
# largo que el del bloqueo.

# ─── Dos avisos del journal que son ESPERADOS acá, no fallas ───
#
#   [WARN] Compositor is missing hyprland-lock-notify-v1!
#       Correcto: ese protocolo es de Hyprland. Ver el bloque de inhibit_sleep más abajo.
#       Consecuencia práctica: `on_lock_cmd` y `on_unlock_cmd` NO funcionan, por eso no se
#       usan (sí funcionan `lock_cmd`/`unlock_cmd`, que van por dbus y no por el protocolo).
#
#   [ERR] Another service is already providing the org.freedesktop.ScreenSaver interface
#       Lo provee NIRI (verificado: `busctl --user list | grep ScreenSaver` -> pid de
#       `niri --session`). No es un hypridle duplicado. Y no se pierde nada: los inhibidores
#       de idle de las apps (Firefox, mpv) los atiende niri, que simplemente deja de emitir
#       ext-idle-notify mientras haya uno activo — que es justo el evento del que depende
#       hypridle. O sea que la inhibición sigue funcionando, una capa más abajo.

general {
    # `lock_cmd` corre cuando llega el evento Lock de logind por dbus, que es lo que dispara
    # `loginctl lock-session`. Todo lo que quiera bloquear la sesión pasa por ahí — el
    # listener de abajo, el before_sleep, y cualquier otro programa— así que hay UN solo
    # lugar donde se decide con qué se bloquea.
    #
    # `lock` es el wrapper de ~/.local/bin/lock: garantiza que exista la copia del wallpaper
    # que hyprlock usa de fondo y evita apilar dos lockers.
    lock_cmd = lock

    # Evento Unlock de logind (`loginctl unlock-session`). hyprlock desbloquea con SIGUSR1
    # (registerSignalAction(SIGUSR1, handleUnlockSignal) en su hyprlock.cpp).
    unlock_cmd = pkill -USR1 -x hyprlock

    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors

    # ─── inhibit_sleep: por qué 1 y no el default ───
    #
    # 1 = "normal": hypridle mantiene un inhibidor `delay` de logind y lo suelta después de
    # lanzar before_sleep_cmd.
    #
    # NO se usa 2 (auto) ni 3 (esperar al lock) porque los dos dependen del protocolo
    # `hyprland-lock-notify-v1`, que es de Hyprland y **niri no implementa** (niri expone
    # ext_session_lock_v1 y ext_idle_notifier_v1, verificado sobre el binario). Sin ese
    # protocolo:
    #   - el modo 2 detecta que no está y cae solo a "normal", o sea que 1 y 2 hacen lo
    #     mismo acá; se escribe 1 para que se lea la intención.
    #   - el modo 3 es PEOR QUE INÚTIL: en la v0.1.8 el `case 3` solo asigna si el
    #     lockNotifier existe, y `m_inhibitSleepBehavior` no tiene inicializador en
    #     Hypridle.hpp — o sea que sin el protocolo queda con un valor indeterminado.
    #     No usarlo mientras el compositor sea niri.
    #
    # LO QUE SE PIERDE respecto de swayidle: swayidle corría con `-w`, que ESPERA a que el
    # comando termine antes de dejar seguir la suspensión. hypridle no espera: lanza
    # before_sleep_cmd de forma asíncrona (CProcess::runAsync) y suelta el inhibidor
    # enseguida, así que existe una ventana en la que la máquina puede suspenderse antes de
    # que hyprlock haya tomado ext-session-lock, y al despertar se ve el escritorio un
    # instante. Es la razón de ser de `general:immediate_render = true` en hyprlock.conf.
    # La ventana se cierra del todo solo cuando el compositor implemente lock-notify.
    inhibit_sleep = 1
}

# ─── 10 min: apagar pantallas ───
#
# En niri el DPMS no se pide con hyprctl (eso es de Hyprland) sino con `niri msg action`.
listener {
    timeout = 600
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# ─── 20 min: bloquear ───
#
# Se manda el evento a logind en vez de invocar el locker directo: así el estado de la
# sesión (`loginctl show-session --property=LockedHint`) queda correcto y el bloqueo entra
# por el mismo camino que el de antes de suspender. Quién bloquea lo decide `lock_cmd`.
listener {
    timeout = 1200
    on-timeout = loginctl lock-session
}
