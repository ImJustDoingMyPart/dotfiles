# hypridle 0.1.8 — apagar pantallas y bloquear por inactividad.
#
# Los tiempos son de desktop, no de notebook: acá no hay batería que cuidar, así que la
# pantalla se apaga tarde y el bloqueo llega después.
#
#   10 min -> apagar pantallas (DPMS). Cualquier input las vuelve a encender.
#   20 min -> bloquear.
#   antes de suspender -> bloquear siempre.
#
# NO hay listener de `systemctl suspend`: esta máquina no se suspende sola (ver la nota de
# suspensión en el vault). Si alguna vez se quiere, se agrega un listener con un timeout más
# largo que el del bloqueo.
#
# hypridle es el dueño de org.freedesktop.ScreenSaver en el bus de sesión
# (`busctl --user list | grep ScreenSaver`): los inhibidores de idle por D-Bus (navegador,
# mpv, juegos vía SDL) le llegan directo. Los juegos además llevan `idle_inhibit` en
# cfg/rules.lua, por si juegan con joystick y no inhiben solos.

general {
    # `lock_cmd` corre cuando llega el evento Lock de logind por dbus, que es lo que dispara
    # `loginctl lock-session`. Todo lo que quiera bloquear la sesión pasa por ahí — el
    # listener de abajo, el before_sleep, y cualquier otro programa— así que hay UN solo
    # lugar donde se decide con qué se bloquea.
    #
    # `lock` es el wrapper de ~/.local/bin/lock: garantiza que exista la copia del wallpaper
    # que hyprlock usa de fondo y evita apilar dos lockers.
    lock_cmd = lock

    # Evento Unlock de logind (`loginctl unlock-session`). hyprlock desbloquea con SIGUSR1
    # (registerSignalAction(SIGUSR1, handleUnlockSignal) en su hyprlock.cpp).
    unlock_cmd = pkill -USR1 -x hyprlock

    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # ─── inhibit_sleep = 3: la suspensión espera a que la sesión esté bloqueada ───
    #
    # `loginctl lock-session` vuelve apenas manda la señal, mucho antes de que el locker
    # dibuje. Con el modo 1 hypridle suelta el inhibidor `delay` de logind en cuanto LANZA
    # before_sleep_cmd, y la máquina puede dormirse en ese hueco: al despertar se ve el
    # escritorio desbloqueado un instante. El modo 3 lo suelta recién cuando Hyprland reporta
    # la sesión bloqueada por `hyprland-lock-notify-v1`.
    #
    # Hay que escribirlo: el default (2, auto) elige 3 solo si reconoce hyprlock en los
    # comandos, y acá `lock_cmd` es el wrapper `lock`, así que caería a 1. Al arrancar,
    # hypridle imprime el modo elegido ("inhibiting until the wayland session gets locked").
    # Doc: wiki.hypr.land, hypridle → general y "Locking before sleep".
    inhibit_sleep = 3
}

# ─── 10 min: apagar pantallas ───
#
# Con config Lua, `hyprctl dispatch` recibe una expresión Lua (es un envoltorio de
# `hl.dispatch(…)`): la sintaxis vieja `dpms off` no existe.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# ─── 20 min: bloquear ───
#
# Se manda el evento a logind en vez de invocar el locker directo: así el estado de la
# sesión (`loginctl show-session --property=LockedHint`) queda correcto y el bloqueo entra
# por el mismo camino que el de antes de suspender. Quién bloquea lo decide `lock_cmd`.
listener {
    timeout = 1200
    on-timeout = loginctl lock-session
}
