# Template de matugen -> ~/.config/themes/matugen/kitty.conf
#
# Reemplaza al template `alacritty.toml` (2026-08-07, migración a kitty). kitty importa
# un archivo de tema aparte con `include ./themes/theme.conf`, así que la indirección es
# la misma que había: solo cambia el formato del archivo importado (clave/valor en vez de
# TOML) y quién lo lee.
#
# Los 8 colores ANSI no salen de roles de Material 3 uno a uno (M3 no tiene "rojo" ni
# "verde"): se mapean a los roles cuyo contraste se parece al rol semántico que la terminal
# espera. Es el mismo mapeo que tenía el template de Alacritty, portado tal cual para que
# la migración no cambie los colores.
#
# Sin placeholders dentro de comentarios: el motor de matugen no los distingue.

background {{colors.surface.default.hex}}
foreground {{colors.on_surface.default.hex}}

cursor            {{colors.on_surface.default.hex}}
cursor_text_color {{colors.surface.default.hex}}

selection_foreground {{colors.on_surface.default.hex}}
selection_background {{colors.surface_container_highest.default.hex}}

url_color {{colors.primary.default.hex}}

color0 {{colors.surface_container_highest.default.hex}}
color1 {{colors.error.default.hex}}
color2 {{colors.primary.default.hex}}
color3 {{colors.tertiary.default.hex}}
color4 {{colors.secondary.default.hex}}
color5 {{colors.primary_fixed_dim.default.hex}}
color6 {{colors.secondary_fixed_dim.default.hex}}
color7 {{colors.on_surface.default.hex}}

color8  {{colors.outline.default.hex}}
color9  {{colors.error.default.hex}}
color10 {{colors.primary.default.hex}}
color11 {{colors.tertiary.default.hex}}
color12 {{colors.secondary.default.hex}}
color13 {{colors.primary_fixed_dim.default.hex}}
color14 {{colors.secondary_fixed_dim.default.hex}}
color15 {{colors.on_surface.default.hex}}
