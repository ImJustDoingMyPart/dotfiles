# Template de matugen -> ~/.config/themes/matugen/alacritty.toml
#
# Reemplaza al template builtin "alacritty" que escribía Noctalia. Alacritty ya importa un
# archivo de tema aparte desde su config, así que la indirección existía: solo cambia quién
# escribe el archivo importado.
#
# Los 8 colores ANSI no salen de roles de Material 3 uno a uno (M3 no tiene "rojo" ni
# "verde"): se mapean a los roles cuyo contraste se parece al rol semántico que la terminal
# espera. Es la misma aproximación que hacía Noctalia.
#
# Sin placeholders dentro de comentarios: el motor de matugen no los distingue.

[colors.primary]
background = '{{colors.surface.default.hex}}'
foreground = '{{colors.on_surface.default.hex}}'

[colors.cursor]
text   = '{{colors.surface.default.hex}}'
cursor = '{{colors.on_surface.default.hex}}'

[colors.vi_mode_cursor]
text   = '{{colors.surface.default.hex}}'
cursor = '{{colors.primary.default.hex}}'

[colors.selection]
text       = '{{colors.on_surface.default.hex}}'
background = '{{colors.surface_container_highest.default.hex}}'

[colors.search.matches]
foreground = '{{colors.on_surface.default.hex}}'
background = '{{colors.tertiary.default.hex}}'

[colors.search.focused_match]
foreground = '{{colors.surface.default.hex}}'
background = '{{colors.primary.default.hex}}'

[colors.footer_bar]
foreground = '{{colors.on_surface_variant.default.hex}}'
background = '{{colors.surface_container.default.hex}}'

[colors.normal]
black   = '{{colors.surface_container_highest.default.hex}}'
red     = '{{colors.error.default.hex}}'
green   = '{{colors.primary.default.hex}}'
yellow  = '{{colors.tertiary.default.hex}}'
blue    = '{{colors.secondary.default.hex}}'
magenta = '{{colors.primary_fixed_dim.default.hex}}'
cyan    = '{{colors.secondary_fixed_dim.default.hex}}'
white   = '{{colors.on_surface.default.hex}}'

[colors.bright]
black   = '{{colors.outline.default.hex}}'
red     = '{{colors.error.default.hex}}'
green   = '{{colors.primary.default.hex}}'
yellow  = '{{colors.tertiary.default.hex}}'
blue    = '{{colors.secondary.default.hex}}'
magenta = '{{colors.primary_fixed_dim.default.hex}}'
cyan    = '{{colors.secondary_fixed_dim.default.hex}}'
white   = '{{colors.on_surface.default.hex}}'
