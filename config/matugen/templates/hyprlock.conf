# Template de matugen -> ~/.config/themes/matugen/hyprlock.conf
#
# SOLO COLOR. La estructura del lock (tamaños, posiciones, textos) vive en
# ~/.config/hypr/hyprlock.conf, que trae este archivo con `source`. Es la diferencia con el
# template de swaylock al que reemplaza: swaylock no soporta include, así que allá el
# archivo del tema tenía que ser la config entera y había que duplicarla en cada tema.
#
# Formato: variables de hyprlang. Se sustituyen por texto plano donde aparezcan, así que
# tienen que definirse ANTES de usarse — de ahí que el `source` esté al principio del otro
# archivo.
#
# Formato de color: hyprlock acepta rgb(rrggbb) y rgba(rrggbbaa) hexadecimales, y también
# las formas por coma rgb(r,g,b) y rgba(r,g,b,a) con el alfa como float 0..1 (verificado en
# configStringToInt(), src/helpers/MiscFunctions.cpp de la v0.9.6). Por eso `hex_stripped`
# va envuelto en rgb() y el `set_alpha` de matugen —que emite la forma por coma— entra tal
# cual.
#
# CUIDADO al editar: el motor de matugen NO distingue comentarios. Un placeholder de ejemplo
# escrito dentro de un comentario se intenta renderizar igual y rompe el archivo entero.

# Fondo plano de emergencia: es lo único que se ve si falta la copia del wallpaper.
$theme_surface = rgb({{colors.surface.default.hex_stripped}})

# Relleno del campo de contraseña. Translúcido sobre el fondo desenfocado con el MISMO 0.85
# que la barra de waybar: las dos son superficies que dejan pasar el wallpaper.
$theme_card = {{colors.surface_container.default.rgba | to_color | set_alpha: 0.85}}

$theme_fg     = rgb({{colors.on_surface.default.hex_stripped}})
$theme_fg_dim = rgb({{colors.on_surface_variant.default.hex_stripped}})

# ─── Colores del reloj, en forma PANGO ───
#
# El reloj se pinta con markup de pango dentro de un solo label (ver hyprlock.conf), y pango
# NO entiende la sintaxis `rgb(...)` de hyprlock: pango_color_parse solo acepta `#rrggbb` y
# los nombres X11. Por eso estos tres van sin envolver, con `#` en vez de `rgb()`.
#
# El `##` no es un error de tipeo: en hyprlang `#` abre comentario en cualquier posición de
# la línea, así que un `#rrggbb` a secas se comería el valor entero. `##` es el escape que
# define el propio hyprlang y llega a pango como un solo `#`.
#
# El par hora/minutos es el MISMO que el degradé del campo de contraseña, el focus-ring de
# niri y el borde de walker (primary -> tertiary). Los dos puntos van en el gris del texto
# secundario para que separen sin competir.
$theme_hour  = ##{{colors.primary.default.hex_stripped}}
$theme_min   = ##{{colors.tertiary.default.hex_stripped}}
$theme_colon = ##{{colors.on_surface_variant.default.hex_stripped}}

# El par del degradé. Es exactamente el mismo que el focus-ring de niri y el borde de
# walker, para que el campo de contraseña se lea como una ventana enfocada más.
$theme_accent     = rgb({{colors.primary.default.hex_stripped}})
$theme_accent_alt = rgb({{colors.tertiary.default.hex_stripped}})

$theme_error = rgb({{colors.error.default.hex_stripped}})

# Bloq Mayús. Rol `tertiary`, igual que el `@warning` de waybar: es la misma categoría de
# aviso "esto no está mal, pero mirá". Se declara aparte de accent_alt aunque hoy coincidan
# porque el significado es otro y puede querer separarse.
$theme_warning = rgb({{colors.tertiary.default.hex_stripped}})
