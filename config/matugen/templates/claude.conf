# Paleta de la status line de Claude Code (ver ~/.local/bin/claude-statusline).
#
# Formato deliberadamente tonto —CLAVE=#hex, una por línea— porque lo lee un script
# con un split en "=": no hay parser de TOML/CSS del otro lado.
#
# Los nombres son SEMÁNTICOS (ok/warn/crit), no de color: el script elige cuál usar
# según cuánta cuota queda, así que un tema curado puede mapearlos a lo que quiera
# mientras "crit" siga leyéndose como alarma. Ver gruvbox-dark-medium/claude.conf.

# Texto normal y texto secundario (etiquetas, separadores).
fg={{colors.on_surface.default.hex}}
dim={{colors.outline.default.hex}}
sep={{colors.outline_variant.default.hex}}

# Identidad de la sesión: modelo y directorio.
model={{colors.primary.default.hex}}
dir={{colors.secondary.default.hex}}
branch={{colors.tertiary.default.hex}}

# Escala de la cuota. El script pinta la barra y el porcentaje con uno de estos tres
# según el % que QUEDA: ok > 40 >= warn > 15 >= crit.
#
# Los tres son colores propios armonizados (config.custom_colors en config.toml), NO
# roles de Material: un esquema tonal gira alrededor de un solo matiz y no da tres
# colores que se distingan. El porqué largo está en el comentario de config.toml.
ok={{colors.quota_ok.default.hex}}
warn={{colors.quota_warn.default.hex}}
crit={{colors.quota_crit.default.hex}}

# Parte vacía de la barra. Tiene que contrastar con el fondo de la terminal pero
# quedar claramente por debajo de la parte llena.
empty={{colors.surface_container_highest.default.hex}}

# Contexto de la ventana actual y costo en dólares.
ctx={{colors.secondary_fixed_dim.default.hex}}
cost={{colors.outline.default.hex}}
