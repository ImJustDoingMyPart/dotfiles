# Template de matugen. NO es el starship.toml: es solo el bloque de paleta que
# `starship-palette-apply` inyecta dentro de él entre marcadores.
#
# Por qué no se genera el archivo entero (el gotcha que ya estaba anotado en el plan):
# matugen sobreescribe el archivo completo, y starship.toml tiene el PROMPT de Roberto.
# Generarlo entero borraría esa configuración en cada cambio de wallpaper. Noctalia
# resolvía lo mismo inyectando entre marcadores; acá se replica con un post_hook.

[palettes.theme]
# Colores estándar
blue      = "{{colors.secondary.default.hex}}"
red       = "{{colors.error.default.hex}}"
green     = "{{colors.primary.default.hex}}"
yellow    = "{{colors.tertiary.default.hex}}"
cyan      = "{{colors.secondary_fixed_dim.default.hex}}"
magenta   = "{{colors.primary_fixed_dim.default.hex}}"
white     = "{{colors.on_surface.default.hex}}"
black     = "{{colors.surface_container_highest.default.hex}}"

# Nombres compatibles con Catppuccin, que es lo que asumen la mayoría de los presets
rosewater = "{{colors.tertiary.default.hex}}"
flamingo  = "{{colors.error.default.hex}}"
pink      = "{{colors.primary_fixed_dim.default.hex}}"
mauve     = "{{colors.secondary.default.hex}}"
maroon    = "{{colors.error.default.hex}}"
peach     = "{{colors.tertiary.default.hex}}"
teal      = "{{colors.secondary_fixed_dim.default.hex}}"
sky       = "{{colors.secondary.default.hex}}"
sapphire  = "{{colors.secondary.default.hex}}"
lavender  = "{{colors.primary.default.hex}}"
text      = "{{colors.on_surface.default.hex}}"
subtext1  = "{{colors.on_surface_variant.default.hex}}"
subtext0  = "{{colors.outline.default.hex}}"
overlay2  = "{{colors.outline.default.hex}}"
overlay1  = "{{colors.outline_variant.default.hex}}"
overlay0  = "{{colors.outline_variant.default.hex}}"
surface2  = "{{colors.surface_container_highest.default.hex}}"
surface1  = "{{colors.surface_container_high.default.hex}}"
surface0  = "{{colors.surface_container.default.hex}}"
base      = "{{colors.surface.default.hex}}"
mantle    = "{{colors.surface_container_low.default.hex}}"
crust     = "{{colors.surface_container_lowest.default.hex}}"
