# kitty 0.48.2 — terminal de la PC personal (reemplazó a Alacritty el 2026-08-07).
#
# Traducción 1:1 de la config de Alacritty que había antes. Cada nombre y cada valor de
# abajo está verificado contra la fuente del paquete instalado —
# /usr/lib/kitty/kitty/options/definition.py — y no contra la doc online, que documenta
# la última versión publicada y no necesariamente la 0.48.2 que corre acá.
#
# Lo que NO se tradujo, porque kitty no tiene equivalente y no se inventan claves:
# los colores de `[colors.vi_mode_cursor]`, `[colors.search]` y `[colors.footer_bar]`
# de Alacritty (su barra de búsqueda y su modo vi no existen como tales en kitty).

# ── Tema ──
# Los colores NO se escriben acá: este include apunta a un symlink que reapunta
# `theme-set` al tema activo (mismo modelo que waybar/walker/niri). Las rutas relativas
# de `include` se resuelven contra el directorio de este archivo.
include ./themes/theme.conf

# ── Shell ──
# CRÍTICO: el login shell del usuario es zsh, así que el default (`.`, que usa $SHELL)
# abriría zsh. Alacritty forzaba fish con [terminal.shell]; esta línea es su equivalente.
shell /usr/bin/fish

# TERM se deja en el default `xterm-kitty` A PROPÓSITO (Alacritty lo pisaba con
# xterm-256color). Es lo que hace que Yazi detecte el protocolo gráfico de kitty y muestre
# imágenes reales en vez de los bloques de chafa. El costo es que los hosts remotos
# necesitan el terminfo `xterm-kitty` — ver la nota [[Terminal]] del vault.

# ── Fuente ──
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Ventana ──
window_padding_width    12
hide_window_decorations yes
background_opacity      0.90
# El blur lo aplica NIRI (background-effect en ~/.config/niri/cfg/rules.kdl), no kitty:
# `background_blur` solo funciona si el compositor implementa la extensión, y duplicarlo
# sería una segunda capa sobre la que ya dibuja el compositor. Alacritty tenía blur=false
# por la misma razón.
background_blur         0
# 0 = cerrar sin preguntar, como hacía Alacritty. El default de kitty (-1) pregunta
# cuando hay un comando corriendo en la ventana.
confirm_os_window_close 0

# ── Scrollback, cursor y mouse ──
scrollback_lines      3000
cursor_shape          block
cursor_blink_interval -1
mouse_hide_wait       -1.0

# ── Atajos ──
# Solo se replican los que Alacritty tenía y kitty pone en otra combinación. El resto de
# los defaults de kitty (ctrl+shift+n = ventana nueva, el mismo bind que Alacritty usaba
# para SpawnNewInstance) ya coinciden y no hace falta declararlos.
map ctrl+plus  change_font_size all +2.0
map ctrl+equal change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0     change_font_size all 0
